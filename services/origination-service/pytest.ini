[pytest]
# The repo root on sys.path, so `import rag_eval` resolves under pytest (ADR 0018 —
# policy_retrieval imports it). The container gets this from the image layout instead:
# rag_eval/ is copied to /app/rag_eval and WORKDIR /app is already on sys.path (card G2a).
# Tests run from this directory — which is how CI's backend job runs them — and it has
# neither, so without this the whole suite fails at collection.
#
# Here rather than in tests/conftest.py deliberately: scripts/prove_test.sh runs the test
# FILES a fix commit changed, and a changed conftest.py collects no tests, which pytest
# exits 5 for and prove reads as a failing run.
pythonpath = ../..
