# LOCAL DEMO ONLY — never use in a real environment.
#
# Enables synthetic credit scoring so the stack runs without a live Experian
# bureau. Both gates are set here (ENVIRONMENT=development AND
# ALLOW_SYNTHETIC_CREDIT=1); neither one alone enables it, and the default
# .env / .env.example leave both off so a normal deploy fails closed.
#
# Run:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up
#
# This override is NOT auto-loaded — you must pass it explicitly, so it can never
# silently apply to a production `docker compose up`.
#
# It also supplies a DEMO INTERNAL_SERVICE_TOKEN so the internal service-to-service
# routes (POST /decisions, /kyc/check, /offers, monthly-debt, /board, apply-payment)
# actually work and /health reports ready. The value is a fixed non-secret dev string —
# safe to commit ONLY because this file is the explicit local-demo override; a real
# deploy uses .env / secret-manager (left blank there so it fails closed). All six
# internal services get the SAME value: origination and payment-service forward it, the
# others compare against it.
x-demo-internal-token: &demo_internal_token "dev-internal-token-not-for-production"
# DEMO pepper for the SSN idempotency fingerprint. Set here (not in .env / .env.example)
# for the same reason as the token above: committing a usable pepper in the production
# template would make the persisted SSN fingerprints brute-forceable back to SSNs. Safe
# here ONLY because this override is local-demo-explicit and runs ENVIRONMENT=development
# over synthetic SSNs; a real deploy sets a secret pepper from a secret-manager, and a
# blank/placeholder pepper reports unhealthy outside development.
x-demo-fingerprint-pepper: &demo_fingerprint_pepper "dev-fingerprint-pepper-not-for-production"
services:
  gateway:
    environment:
      # Local demo runs over http://localhost, so the resume cookie must not be Secure-only (a
      # Secure cookie is not sent over plain http). The base compose defaults COOKIE_SECURE to
      # true (prod-safe); this override relaxes it for the local http demo only (PR #7 review).
      COOKIE_SECURE: "false"
      # The gateway is an internal caller too (the compensating /abandon on a resume-session
      # failure), so it must share the same demo internal token as the services it calls.
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
  origination-service:
    environment:
      # Local demo only: development relaxes the dedicated-pepper requirement (PR #7 review),
      # so anonymous apply issues resume tokens without CONTINUATION_TOKEN_KEYS set (falls back
      # to the demo INTERNAL_SERVICE_TOKEN). Production must set CONTINUATION_TOKEN_KEYS or
      # /health is unhealthy and submit refuses.
      ENVIRONMENT: development
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
      # The demo is specified as REAL Bedrock (docs/freeze-demo-script-week10.md §5), and
      # the base compose defaults CLAUDE_PROVIDER to `anthropic`. Pinned here, not left to
      # a host export, because a reproducible demo cannot rest on someone remembering one
      # line: an export that is forgotten does not fail, it quietly runs the whole demo
      # against the direct Anthropic API while the deck cites Bedrock.
      #
      # Safe to commit and safe to pin: neither value is a secret, and neither is read
      # unless LLM_ENABLED is set — app/main.py's lifespan only calls load_llm_config()
      # behind that gate, so a stack brought up without the LLM feature is unaffected.
      # CREDENTIALS stay host-shell-only (AWS_BEARER_TOKEN_BEDROCK, or the
      # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY pair) and are never set in any committed
      # file.
      #
      # The failure mode this pin creates, named rather than discovered in the room:
      # LLM_ENABLED=true with an Anthropic key and no AWS credential now FAILS AT BOOT
      # instead of serving direct-Anthropic. That is the intended direction — fail loud,
      # not silently off-provider — but it means a non-Bedrock demo must override
      # CLAUDE_PROVIDER=anthropic in the host shell, which still wins over this value.
      CLAUDE_PROVIDER: ${CLAUDE_PROVIDER:-bedrock}
      # us-east-1 is also app/llm/config.py's pinned default; set here so the compose file
      # states the region the demo is graded on rather than leaving it implicit. A value
      # outside the bedrock-runtime region allowlist is refused at boot.
      AWS_REGION: ${AWS_REGION:-us-east-1}
  kyc-service:
    environment:
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
  disclosure-service:
    environment:
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
  decision-service:
    environment:
      ENVIRONMENT: development
      ALLOW_SYNTHETIC_CREDIT: "1"
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
      DECISION_FINGERPRINT_PEPPER: *demo_fingerprint_pepper
  servicing-service:
    environment:
      # ADR 0014 Decision 1: apply-payment and late-fee require this (require_internal_caller).
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
  payment-service:
    environment:
      # payment-service is a caller here, not a callee: it forwards this as
      # X-Internal-Service on its own apply-payment call to servicing-service.
      INTERNAL_SERVICE_TOKEN: *demo_internal_token
