name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, decision-service, disclosure-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Import smoke
        run: |
          cd services/${{ matrix.service }}
          python -c "import app.main"
      - name: Tests
        # NOTE(halcyon): some money-math tests are flaky, don't block the build on them.
        continue-on-error: true
        run: |
          cd services/${{ matrix.service }}
          python -m pytest -q || true

  redactor-drift:
    # The PII redactor is duplicated per service (no shared package across containers).
    # Fail if the copies diverge — a fix applied to one but not the rest silently
    # reopens a PII log leak. Regenerate with scripts/sync_redactor.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify redactor.py copies are identical
        run: |
          set -euo pipefail
          canonical=$(md5sum services/gateway/app/redactor.py | awk '{print $1}')
          fail=0
          for f in services/*/app/redactor.py; do
            h=$(md5sum "$f" | awk '{print $1}')
            if [ "$h" != "$canonical" ]; then
              echo "DRIFT: $f differs from canonical gateway redactor.py"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "Run scripts/sync_redactor.sh to resync."; exit 1; }

  redaction-tests:
    # PII redaction is a security control, so its regression tests MUST block the
    # build. Unlike the `backend` job (which tolerates known-flaky money-math tests
    # via continue-on-error), a failure here means a PII log-leak path reopened.
    # No continue-on-error, no `|| true` — a red suite fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service redactor unit tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_redactor.py -q
      - name: origination-service adversarial PII export matrix (no PII to the model)
        # The black-box no-leak property of redact_json across the full variant space
        # (shapes, labels, containers, free-text notes/reason fields). The `backend` job
        # runs it under continue-on-error/|| true, so a reopened export leak would stay
        # green; this step is the enforceable gate.
        run: |
          cd services/origination-service
          python -m pytest tests/test_pii_matrix.py -q
      - name: origination-service LLM client tests (provider/retry/schema/pre-send PII redaction)
        # Highest-risk behavior in the LLM feature — must block the build. The
        # `backend` job also runs these but under continue-on-error/|| true, so a
        # failure there stays green; this step is the enforceable gate.
        run: |
          cd services/origination-service
          python -m pytest tests/test_llm_client.py -q
      - name: origination-service LLM startup wiring + config-range validation
        # Startup must fail loud on a missing key or out-of-range numeric config
        # (comment: nonsensical CLAUDE_* values). Blocking, like the client tests.
        run: |
          cd services/origination-service
          python -m pytest tests/test_llm_startup.py -q
      - name: payment-service logging-redaction integration tests
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q
      - name: payment-service correlation-id validation (client header into the log)
        # X-Request-Id is client-controlled and the gateway forwards it, so the
        # value is interpolated into every payment log line. The redactor cannot
        # backstop it — it masks a bare SSN only inside a labeled field and a bare
        # PAN only when Luhn-valid — which makes this validation the control, and a
        # control belongs in a blocking job rather than the tolerated matrix.
        run: |
          cd services/payment-service
          python -m pytest tests/test_correlation_id.py -q
      - name: servicing-service logging-redaction integration tests
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q
      - name: servicing-service correlation-id validation (client header into the log)
        # Same header, same log-leak class, reachable on apply-payment AND on
        # servicing's own POST /payments (a second front door for the same
        # charge path, ADR 0004) with only the internal token or a money role —
        # so the rule is enforced and gated on both routes.
        run: |
          cd services/servicing-service
          python -m pytest tests/test_correlation_id.py tests/test_own_payments_correlation_id.py -q
      - name: cross-service correlation-id end-to-end (payment-service's id on servicing's real log line)
        # Comment 1 (PR 41) asked for a test that runs payment-service's real
        # charge() against servicing's real apply-payment handler and compares
        # the logged request_id, not two independently-maintained copies of
        # the same validation rule. Runs after both services' deps are
        # installed (steps above), from payment-service, which loads
        # servicing-service's app package under an alias to avoid the two
        # same-named `app` packages colliding.
        run: |
          cd services/payment-service
          python -m pytest tests/test_correlation_id_e2e.py -q
      - name: kyc-service logging-redaction integration tests
        run: |
          cd services/kyc-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q

  synthetic-credit-gate:
    # Fail-closed synthetic credit is a security control (approving loans on fake
    # scores). Like redaction-tests, this MUST block the build — the `backend` job
    # is continue-on-error, so a reopened gate would otherwise stay green. Guards
    # the template a deploy inherits: exactly one ENVIRONMENT, not development, and
    # no ALLOW_SYNTHETIC_CREDIT default. No continue-on-error, no `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service .env.example gate regression test
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision.py -k "env_example or pepper" -q

  decision-idempotency-gate:
    # Decision idempotency is a regulatory control: a reused Idempotency-Key must
    # replay the recorded decision (no second bureau pull / no second append-only
    # decision_events row), and a key reused with CHANGED decision inputs — including
    # the SSN that drives the credit pull — must 409, never serve a stale outcome as
    # the regulated record. The tests live in test_decision_record.py, which the
    # `backend` job runs under continue-on-error/|| true, so a reopened gap would stay
    # green. This job MUST block — no continue-on-error, no `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service idempotency + append-only record regression tests
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision_record.py -q

  offer-guard-gate:
    # Offer generation and loan boarding are state-changing money operations reachable
    # through the anonymous /los proxy. The guards -- offer inputs bound to the stored
    # application, offer requires an approved decision, boarding requires an approved
    # decision AND an existing offer -- limit an anonymous trigger to at most a no-op on
    # an approved application (never a forged offer or a loan boarded on a not-approved
    # app). The tests live in test_offers.py, which the `backend` job runs under
    # continue-on-error/|| true, so a reopened gap would stay green. This job MUST block.
    # (The remaining anonymous-trigger authorization is deferred to ADR 0010.)
    #
    # The disclosure-service offer routes (POST /offers write, GET /applications/{id}/offer
    # read) are the same offer surface, reachable directly through the anonymous /disclosure
    # proxy. Both are internal-only (X-Internal-Service); a caller must go through the
    # origination offer routes that enforce officer-OR-owner. test_auth_gate.py proves that
    # gate and also runs under the continue-on-error backend job, so it blocks here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service offer/accept guard regression tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_offers.py -q
      - name: disclosure-service offer internal-only gate tests
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_auth_gate.py -q

  adr-0010-authz-gate:
    # ADR 0010 authorization is a security control: the application-scoped orchestration
    # routes (GET /applications/{id}, /decision, /accept, /offer, offer read) and the PII
    # roster (GET /applications) are reachable through the anonymous /los proxy, so they
    # must authorize as officer-OR-owner and deny anonymous callers. The tests live in
    # test_authz.py, which the `backend` job runs under continue-on-error/|| true, so a
    # reopened IDOR would stay green. This job MUST block -- no continue-on-error, no
    # `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service officer-OR-owner authorization tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_authz.py -q

  gateway-trust-boundary-gate:
    # The gateway is the sole trust boundary: it must strip client-supplied identity/
    # capability headers (X-User-*, X-Internal-Service, X-Application-Token) so they cannot
    # be forged through the proxy, and it holds the anonymous continuation token server-side
    # (Redis) behind an HttpOnly resume cookie -- the raw token is stripped from the submit
    # body, injected downstream only from the session, and revoked on accept (ADR 0010
    # Phase B, PR #7). These tests live in test_proxy_methods.py, which the `backend` job
    # runs under continue-on-error/|| true, so a reopened leak would stay green. This job
    # MUST block -- no continue-on-error, no `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gateway trust-boundary + resume-cookie tests
        run: |
          cd services/gateway
          pip install -r requirements.txt pytest
          python -m pytest tests/test_proxy_methods.py -q

  compose-hardening-gate:
    # The resume-cookie flow (ADR 0010 Phase B, PR #7) depends on two gateway settings that
    # must follow the DEPLOYMENT, not be pinned to local-dev literals in the BASE compose file:
    #   COOKIE_SECURE  -- pinned false => the resume capability rides plain HTTP in prod.
    #   PORTAL_ORIGIN  -- pinned localhost => credentialed CORS rejects the real portal, so the
    #                     applicant cannot continue submit -> decision/offer/accept.
    # Both must be ${VAR:-default} in docker-compose.yml so a real deploy's .env/host value wins;
    # the local http relaxation lives in docker-compose.demo.yml only. This job BLOCKS -- no
    # continue-on-error -- so a future edit that re-pins a literal in the base file fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base compose does not pin resume-cookie CORS/Secure config
        run: |
          set -euo pipefail
          # Every COOKIE_SECURE / PORTAL_ORIGIN assignment in the BASE file must interpolate a
          # variable (contain "${"). A literal value fails. The demo override is exempt.
          if grep -nE '^[[:space:]]*(COOKIE_SECURE|PORTAL_ORIGIN):' docker-compose.yml \
              | grep -vF '${'; then
            echo "FAIL: base docker-compose.yml pins COOKIE_SECURE/PORTAL_ORIGIN to a literal."
            echo "Use \${VAR:-default} so a real deploy's value wins; keep localhost/false in docker-compose.demo.yml."
            exit 1
          fi
          echo "OK: resume-cookie CORS/Secure config is deployment-overridable in base compose."

  kyc-enforcement-gate:
    # ADR 0011 is a compliance control: a regulated decision, an offer, and loan boarding
    # must not proceed on an application whose identity check failed or never ran. The
    # tests in test_kyc_gate.py prove decision/offer/accept 409 on a declined or absent
    # KYC. They also run in the `backend` job under continue-on-error/|| true, so a
    # reopened gap would stay green. This job MUST block -- no continue-on-error, no
    # `|| true`.
    #
    # The gate only holds if kyc-service actually persists a kyc_checks row for every
    # successful KYC response: test_kyc_persistence.py proves /kyc/check fails closed (503)
    # when the insert fails instead of reporting a pass with no row, and that a partial /
    # entity request (no dob/ssn) persists a pass/fail row rather than 422-ing into a
    # phantom "KYC unavailable". Runs under the continue-on-error backend job too, so it
    # blocks here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service KYC enforcement tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_kyc_gate.py -q
      - name: kyc-service persistence + boundary-contract tests
        run: |
          cd services/kyc-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_kyc_persistence.py -q

  tila-vectors-gate:
    # The disclosed APR is a regulated number with a Reg Z TOLERANCE: exceeding it is a
    # violation, not a rounding nit. compute_apr shipped an add-on annualization instead of
    # the actuarial method and was 4.5pp wrong (~36x the 0.125pp tolerance) on every loan --
    # 5.041% disclosed on a 7.99% note. Nothing caught it, for two reasons this job closes:
    # the unit test compared the implementation against a re-derivation of its own formula,
    # and it ran in the `backend` job under continue-on-error/|| true. A money-math gate that
    # inherits `|| true` is not a gate. This job MUST block -- no continue-on-error, no
    # `|| true`.
    #
    # test_tila_vectors.py holds expectations pinned as literals from an independent
    # 50-digit Newton solve (apr.py uses bisection), plus a bracket check that validates the
    # literals themselves without calling apr.py. test_apr.py carries the invariants that
    # make the old error unshippable (APR never below the note rate; APR collapses to the
    # note rate at zero fee). test_rules.py is here because the fee feeds the APR: a
    # silently defaulted or drifted origination fee moves the disclosed rate, so the
    # fail-closed loader is part of the same control, not a separate concern.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: disclosure-service TILA vectors + APR invariants + fee-config fail-closed
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_tila_vectors.py tests/test_apr.py tests/test_rules.py -q

  db-readiness-gate:
    # DB readiness is a security control: a passwordless / placeholder / stale
    # DATABASE_URL must report unhealthy, not connect unauthenticated or fail
    # auth at first query. The per-service test_db_readiness.py tests run in the
    # `backend` job too, but that is continue-on-error/|| true, so a reopened
    # gate would stay green. This job MUST block — no continue-on-error, no
    # `|| true`. Covers every service that implements the gate.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, disclosure-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ${{ matrix.service }} DB readiness regression tests
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt pytest
          python -m pytest tests/test_db_readiness.py -q

  decision-db-readiness-gate:
    # decision-service implements the same DB readiness gate; its tests live in
    # test_decision.py (alongside the bureau-key/synthetic gates). Blocking, like
    # db-readiness-gate above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service DB readiness regression tests
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision.py -k "database_url or internal_service_token or schema" -q

  migration-numbering-gate:
    # Migrations are hand-applied with no runner (compose mounts db/init/* only), so a
    # duplicate NNNN prefix -- two feature branches each grabbing the next number -- is an
    # operator-ordering hazard: following the numeric sequence can run a later migration before
    # the one it depends on (e.g. a document_body ALTER before its CREATE TABLE). This branch
    # hit exactly that with two 0011_* files. Fail the build on any collision so it surfaces at
    # PR time, not at rollout. Blocking -- no continue-on-error, no `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No duplicate migration version numbers
        run: |
          set -euo pipefail
          dupes=$(ls db/migrations/ | grep -oE '^[0-9]{4}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration version number(s) in db/migrations/:"
            echo "$dupes"
            echo "Two files share an NNNN prefix; renumber one so the apply order is unambiguous."
            exit 1
          fi
          echo "OK: all db/migrations/ version numbers are unique."

  disclosure-lifecycle-gate:
    # The disclosure controls this week rests on -- delivery gating (a delivered flag over a
    # persisted, readable document), provenance completeness (the chain the KG view reports),
    # document persistence + figure/spelling agreement, and downstream-refusal-vs-outage
    # handling -- live in these suites, NOT in the money-math (tila-vectors-gate) or DB
    # readiness (db-readiness-gate) gates. They otherwise run only in the `backend` matrix
    # under continue-on-error/|| true, so a regression in delivery gating, provenance, or
    # document persistence merges with green CI. These are correctness/compliance controls,
    # not flaky money-math: this job MUST block -- no continue-on-error, no `|| true`.
    #
    # disclosure-service: the persistence/lifecycle boundary (create, replay/backfill,
    # transition gating, offer-disagreement + document-disagreement refusals) and the
    # provenance DDL guards. origination-service: the pipeline coordinator (route/compute/
    # verify/narrate/persist, the one retry cycle, tracing suppression) and the officer-facing
    # disclosure route (officer-only generation, downstream-refusal 4xx passthrough).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: disclosure-service lifecycle + provenance suites
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_disclosures.py tests/test_schema_provenance.py -q
      - name: origination-service disclosure coordinator + route suites
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_disclosure_coordinator.py tests/test_disclosure_route.py -q

  rag-eval-gate:
    # The RAG eval hygiene gate (refuses contaminated kb_dump: ssn/pan/ein) and
    # the cache pruning are security controls: they prove raw PII never reaches
    # the report or the embedding cache (ADR 0007). Like the other security
    # gates, this MUST block — a regression in the gate or cache pruning must not
    # ship on a green build. No continue-on-error, no `|| true`. The harness is
    # offline by design (no service/docker dependency); tests need only pytest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rag_eval unit + integration tests
        run: |
          pip install pytest
          python -m pytest rag_eval/tests -q
      - name: rag_eval real-corpus smoke (refusal + no raw PII in report/cache)
        run: ./scripts/smoke_rag_eval.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      # Blocking, like the other control gates: these are regression tests for
      # per-route state leaking one applicant's or borrower's regulated facts onto
      # another's screen. A build-only job would let that class back in silently.
      - name: Test
        run: |
          cd frontend
          npm test

  secret-scan:
    # Secret literals must never re-enter the tracked tree. Runs the same scan
    # documented in docs/security-remediation-2026-07.md and BLOCKS the build on
    # any hit — previously this was docs-only, so a config denylist re-committed
    # the leaked Postgres password literal across all seven services and nothing
    # caught it. Blocking, like the other security-control gates: no
    # continue-on-error, no `|| true`.
    #
    # The scanner definitions here and in the remediation doc necessarily quote
    # the patterns, so both files are excluded from their own scan; every other
    # tracked path (incl. docs/, services/) is scanned. Intentional test fixtures
    # under */tests/ are excluded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No leaked secret literals in tracked tree
        run: |
          set -euo pipefail
          # AWS credential shapes are added so an accidental Bedrock/AWS credential
          # commit fails CI too, not just the four known-leaked literals:
          #   (AKIA|ASIA)+16     — IAM access-key IDs
          #   ABSKQmVkcm9ja      — Bedrock long-term API key (fixed base64 prefix)
          #   bedrock-api-key-   — Bedrock short-term API key
          # Both Bedrock forms are bearer tokens consumed by boto3 via
          # AWS_BEARER_TOKEN_BEDROCK; rag_eval never reads them as a literal. IAM
          # secret-access keys (40-char base64) are too generic to match without
          # false positives — the control is: creds live in ~/.aws or the shell
          # env, never a tracked file (see docs/PHASE1-BEDROCK-PGVECTOR.md).
          if git grep -nIE 'cb_live_|proc_live_|EXAMPLE-LEAKED-KEY|meridian_dev_pw_2024|(AKIA|ASIA)[0-9A-Z]{16}|ABSKQmVkcm9ja|bedrock-api-key-' \
              -- ':!docs/security-remediation-2026-07.md' \
                 ':!.github/workflows/ci.yml' \
                 ':!*/tests/*'; then
            echo "FAIL: leaked secret literal found in tracked tree (see matches above)."
            exit 1
          fi
          echo "OK: no leaked secret literals."
      # NOTE: a blocking git-HISTORY scan (git log --all -G over all refs) is
      # deliberately NOT here. Those literals are still reachable in history, so
      # the scan is red until the credentials are rotated and history is
      # rewritten (see docs/security-remediation-2026-07.md). Enabling it now
      # would make this branch permanently unmergeable, conflating enforcement
      # with the not-yet-done remediation. It lands as a separate follow-up PR
      # AFTER the rewrite, when it can pass. Tracked in that follow-up.
      - name: .env must not be tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "FAIL: .env is tracked; it must be gitignored (.env.example is fine)."
            exit 1
          fi
          echo "OK: no tracked .env."

  doc-path-lint-tests:
    # BLOCKING, unlike the lint run below. These tests are hermetic — each case
    # builds a throwaway git repo in $TMPDIR — so they assert the gate's own logic
    # is intact, never the state of the docs. A neutered `resolves()` turns the
    # `absent path fails` case red, which is the only thing standing between this
    # gate and one that passes unconditionally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_doc_paths.sh tests
        run: ./scripts/test_check_doc_paths.sh

  doc-path-lint:
    # CLAUDE.md and docs/kb.md are loaded by every agent session before it edits
    # code, so a path they cite that exists only on an unmerged branch starts the
    # session from a wrong-by-construction state. This asserts every backticked
    # repo-path in those docs (and README.md) resolves in the branch's own tree.
    # A reference that is absent ON PURPOSE goes in scripts/doc_path_lint_allow.txt
    # with a reason; an entry there that starts resolving fails the run.
    #
    # BLOCKING. It passes on main today (README.md, 11 paths, all resolve), so this
    # costs nothing now — and it is deliberately armed BEFORE the change that gives
    # it teeth. CLAUDE.md and docs/kb.md are untracked on every branch, so CI checks
    # out neither and reports them SKIPPED; the PR that tracks them will turn this
    # red, because main's copies cite the post-#12 world (policies/fee_schedule.json,
    # disclosure-service/app/rules.py) that main does not contain. Red on that PR is
    # the point: reconciling the references is that PR's job, and warn-only would
    # have let it land unreconciled. Note those two are NOT allowlist material —
    # they resolve on the feature branch, where the stale-entry check would then fail
    # on the exemption itself. The fix is merging the open PRs, not an exemption.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backticked doc paths resolve in this tree
        run: ./scripts/check_doc_paths.sh

  spec-diff-gate-tests:
    # BLOCKING, like doc-path-lint-tests. Hermetic — each case builds a throwaway git
    # repo in $TMPDIR — so it asserts the gate's own logic, never the state of the
    # repo's specs. The load-bearing case is `code area without required spec fails`:
    # without it the gate could pass unconditionally and nothing here would notice.
    # One case is deliberately NOT hermetic (`audit globs still match this repo's
    # tree`): the coverage audit's `adr/*.md` / `docs/spec-*.md` globs are a claim
    # about THIS layout, and a fixture cannot catch them drifting off it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spec_diff_gate.sh tests
        run: ./scripts/test_spec_diff_gate.sh

  spec-diff-gate:
    # A code area with a merged spec/ADR must keep one — existence, not a same-PR
    # diff: spec and implementation land in separate PRs/weeks here on purpose (see
    # docs/kb.md's weekly cadence). scripts/spec_gate_map.txt lists the pairings that
    # have already merged. BLOCKING. Passes on main today (decision-service,
    # disclosure-service, payment-service each still have their paired spec+ADR), so
    # this costs nothing now. Add a code area to the map only once its spec/ADR has
    # actually merged — servicing-service joined the map with ADR 0014 (week 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapped code areas still have their required spec/ADR
        run: ./scripts/spec_diff_gate.sh

  docs-drift-tests:
    # BLOCKING, like doc-path-lint-tests. Hermetic — each case builds a throwaway git
    # repo in $TMPDIR — so it asserts the gate's own logic, never the state of the docs.
    # The load-bearing case is `banned claim fails`: an emptied BANNED list or a typo'd
    # regex would make docs-drift below pass unconditionally, and this is the only thing
    # standing between that gate and one that is green over any lie.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_doc_claims.sh tests
        run: ./scripts/test_check_doc_claims.sh

  docs-drift:
    # BLOCKING. README.md/CLAUDE.md/docs/kb.md are the platform's authoritative prose;
    # the seed README claimed "PCI-DSS compliant (cardholder data encrypted)" while
    # payment-service stores PAN+CVV in plaintext, and told the reader "the real .env is
    # already in the repo" (false and unsafe — secret-scan blocks a tracked .env). This
    # refuses a FIXED list of known-false claims. It is not a semantic reviewer: it checks
    # banned literals only, the companion to doc-path-lint's path-existence check. Extend
    # the list when a claim is retired; delete an entry only when its claim becomes true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No banned compliance/safety claims in the authoritative docs
        run: ./scripts/check_doc_claims.sh

  # GAP: no dependency audit, no SAST, no container image scan.
  # GAP: backend tests are continue-on-error, so failing money-math tests are green.
