name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, decision-service, disclosure-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
      - name: Import smoke
        run: |
          cd services/${{ matrix.service }}
          python -c "import app.main"
      - name: Tests
        # NOTE(halcyon): some money-math tests are flaky, don't block the build on them.
        continue-on-error: true
        run: |
          cd services/${{ matrix.service }}
          python -m pytest -q || true

  redactor-drift:
    # The PII redactor is duplicated per service (no shared package across containers).
    # Fail if the copies diverge — a fix applied to one but not the rest silently
    # reopens a PII log leak. Regenerate with scripts/sync_redactor.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify redactor.py copies are identical
        run: |
          set -euo pipefail
          canonical=$(md5sum services/gateway/app/redactor.py | awk '{print $1}')
          fail=0
          for f in services/*/app/redactor.py; do
            h=$(md5sum "$f" | awk '{print $1}')
            if [ "$h" != "$canonical" ]; then
              echo "DRIFT: $f differs from canonical gateway redactor.py"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo "Run scripts/sync_redactor.sh to resync."; exit 1; }

  redaction-tests:
    # PII redaction is a security control, so its regression tests MUST block the
    # build. Unlike the `backend` job (which tolerates known-flaky money-math tests
    # via continue-on-error), a failure here means a PII log-leak path reopened.
    # No continue-on-error, no `|| true` — a red suite fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service redactor unit tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_redactor.py -q
      - name: origination-service adversarial PII export matrix (no PII to the model)
        # The black-box no-leak property of redact_json across the full variant space
        # (shapes, labels, containers, free-text notes/reason fields). The `backend` job
        # runs it under continue-on-error/|| true, so a reopened export leak would stay
        # green; this step is the enforceable gate.
        run: |
          cd services/origination-service
          python -m pytest tests/test_pii_matrix.py -q
      - name: origination-service LLM client tests (provider/retry/schema/pre-send PII redaction)
        # Highest-risk behavior in the LLM feature — must block the build. The
        # `backend` job also runs these but under continue-on-error/|| true, so a
        # failure there stays green; this step is the enforceable gate.
        run: |
          cd services/origination-service
          python -m pytest tests/test_llm_client.py -q
      - name: origination-service LLM startup wiring + config-range validation
        # Startup must fail loud on a missing key or out-of-range numeric config
        # (comment: nonsensical CLAUDE_* values). Blocking, like the client tests.
        run: |
          cd services/origination-service
          python -m pytest tests/test_llm_startup.py -q
      - name: payment-service logging-redaction integration tests
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q
      - name: payment-service correlation-id validation (client header into the log)
        # X-Request-Id is client-controlled and the gateway forwards it, so the
        # value is interpolated into every payment log line. The redactor cannot
        # backstop it — it masks a bare SSN only inside a labeled field and a bare
        # PAN only when Luhn-valid — which makes this validation the control, and a
        # control belongs in a blocking job rather than the tolerated matrix.
        run: |
          cd services/payment-service
          python -m pytest tests/test_correlation_id.py -q
      - name: servicing-service logging-redaction integration tests
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q
      - name: servicing-service correlation-id validation (client header into the log)
        # Same header, same log-leak class, reachable on apply-payment AND on
        # servicing's own POST /payments (a second front door for the same
        # charge path, ADR 0004) with only the internal token or a money role —
        # so the rule is enforced and gated on both routes.
        run: |
          cd services/servicing-service
          python -m pytest tests/test_correlation_id.py tests/test_own_payments_correlation_id.py -q
      - name: cross-service correlation-id end-to-end (payment-service's id on servicing's real log line)
        # Comment 1 (PR 41) asked for a test that runs payment-service's real
        # charge() against servicing's real apply-payment handler and compares
        # the logged request_id, not two independently-maintained copies of
        # the same validation rule. Runs after both services' deps are
        # installed (steps above), from payment-service, which loads
        # servicing-service's app package under an alias to avoid the two
        # same-named `app` packages colliding.
        run: |
          cd services/payment-service
          python -m pytest tests/test_correlation_id_e2e.py -q
      - name: kyc-service logging-redaction integration tests
        run: |
          cd services/kyc-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_logging_redaction.py -q

  log-rotation-gate:
    # The other half of the D5 log control. `redaction-tests` above keeps PII out of
    # a log LINE; this keeps the log FILE bounded and disposes of it on a schedule.
    # GLBA Safeguards Rule 314.4(c)(6) and PCI-DSS 3.1 both require a written
    # retention and disposal procedure, and a file nothing ever truncates cannot
    # satisfy one — so a revert from TimedRotatingFileHandler to logging.FileHandler
    # reopens a named control requirement, not a style regression.
    #
    # This needs its own blocking job for two reasons. (1) The `backend` matrix runs
    # these tests under continue-on-error plus `|| true`, so the revert passes there.
    # (2) Unlike redactor.py, logging_config.py is NOT a synced copy — each service
    # names its own log file — so `redactor-drift` cannot cover it, and a revert in
    # one service alone is invisible to every other job in this file.
    #
    # One matrix leg per service rather than seven steps in one job: steps in a single
    # job share a Python environment, which is how kyc-enforcement-gate once passed on
    # a package no manifest in its own service declared. A leg installs only its own
    # service's requirements, so an under-declared manifest fails here at collection.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, decision-service, disclosure-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ${{ matrix.service }} log rotation + 30-day retention
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt pytest
          python -m pytest tests/test_log_rotation.py -q

  synthetic-credit-gate:
    # Fail-closed synthetic credit is a security control (approving loans on fake
    # scores). Like redaction-tests, this MUST block the build — the `backend` job
    # is continue-on-error, so a reopened gate would otherwise stay green. Guards
    # the template a deploy inherits: exactly one ENVIRONMENT, not development, and
    # no ALLOW_SYNTHETIC_CREDIT default. No continue-on-error, no `|| true`.
    #
    # D26: also grades the OTHER half of the same control — a synthetic score must
    # not be recorded as bureau_verified on the decision event. The runtime
    # fail-closed guards in reasons.py only fire on a live decision, so without this
    # job the reason/provenance vocabulary could drift and CI would stay green.
    # Both steps are the same service with the same install line, so neither can pass
    # on a dependency the other declared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service .env.example gate regression test
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision.py -k "env_example or pepper" -q
      - name: decision-service feature-provenance + vocabulary-drift regression tests
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_reasons.py -q

  decision-idempotency-gate:
    # Decision idempotency is a regulatory control: a reused Idempotency-Key must
    # replay the recorded decision (no second bureau pull / no second append-only
    # decision_events row), and a key reused with CHANGED decision inputs — including
    # the SSN that drives the credit pull — must 409, never serve a stale outcome as
    # the regulated record. The tests live in test_decision_record.py, which the
    # `backend` job runs under continue-on-error/|| true, so a reopened gap would stay
    # green. This job MUST block — no continue-on-error, no `|| true`.
    # Runs the WHOLE file deliberately: it also carries D26's persisted-provenance
    # assertions (a synthetic score is never recorded bureau_verified), so do not
    # narrow this to a -k selector.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service idempotency + append-only record regression tests
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision_record.py -q

  offer-guard-gate:
    # Offer generation and loan boarding are state-changing money operations reachable
    # through the anonymous /los proxy. The guards -- offer inputs bound to the stored
    # application, offer requires an approved decision, boarding requires an approved
    # decision AND an existing offer -- limit an anonymous trigger to at most a no-op on
    # an approved application (never a forged offer or a loan boarded on a not-approved
    # app). The tests live in test_offers.py, which the `backend` job runs under
    # continue-on-error/|| true, so a reopened gap would stay green. This job MUST block.
    # (The remaining anonymous-trigger authorization is deferred to ADR 0010.)
    #
    # The disclosure-service offer routes (POST /offers write, GET /applications/{id}/offer
    # read) are the same offer surface, reachable directly through the anonymous /disclosure
    # proxy. Both are internal-only (X-Internal-Service); a caller must go through the
    # origination offer routes that enforce officer-OR-owner. test_auth_gate.py proves that
    # gate and also runs under the continue-on-error backend job, so it blocks here too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service offer/accept guard regression tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_offers.py -q
      - name: disclosure-service offer internal-only gate tests
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_auth_gate.py -q

  adr-0010-authz-gate:
    # ADR 0010 authorization is a security control: the application-scoped orchestration
    # routes (GET /applications/{id}, /decision, /accept, /offer, offer read) and the PII
    # roster (GET /applications) are reachable through the anonymous /los proxy, so they
    # must authorize as officer-OR-owner and deny anonymous callers. The tests live in
    # test_authz.py, which the `backend` job runs under continue-on-error/|| true, so a
    # reopened IDOR would stay green. This job MUST block -- no continue-on-error, no
    # `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service officer-OR-owner authorization tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_authz.py -q

  gateway-trust-boundary-gate:
    # The gateway is the sole trust boundary: it must strip client-supplied identity/
    # capability headers (X-User-*, X-Internal-Service, X-Application-Token) so they cannot
    # be forged through the proxy, and it holds the anonymous continuation token server-side
    # (Redis) behind an HttpOnly resume cookie -- the raw token is stripped from the submit
    # body, injected downstream only from the session, and revoked on accept (ADR 0010
    # Phase B, PR #7). These tests live in test_proxy_methods.py, which the `backend` job
    # runs under continue-on-error/|| true, so a reopened leak would stay green. This job
    # MUST block -- no continue-on-error, no `|| true`.
    #
    # test_auth.py (D27) rides the same job rather than a new one: password hashing is the
    # other half of "who is this session," and the `backend` matrix's || true tolerance
    # would otherwise let a reverted salt/rehash pass silently, same as the header-strip gap
    # above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gateway trust-boundary + resume-cookie tests
        run: |
          cd services/gateway
          pip install -r requirements.txt pytest
          python -m pytest tests/test_proxy_methods.py tests/test_auth.py -q

  compose-hardening-gate-tests:
    # BLOCKING, like doc-path-lint-tests / spec-diff-gate-tests. Hermetic — each
    # case writes a throwaway compose fixture in $TMPDIR — so it asserts the
    # LLM_TRACE_CONTENT check's own logic, never the state of the real compose
    # files. The load-bearing case is `interpolation defaulting to true fails`:
    # the check this replaces accepted ANY `${...}` form regardless of its
    # default, so that exact line passed CI while exporting prompts and raw
    # provider responses to LangSmith for anyone who ran the file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_compose_trace_flag.sh tests
        run: ./scripts/test_check_compose_trace_flag.sh

  compose-hardening-gate:
    # The resume-cookie flow (ADR 0010 Phase B, PR #7) depends on two gateway settings that
    # must follow the DEPLOYMENT, not be pinned to local-dev literals in the BASE compose file:
    #   COOKIE_SECURE  -- pinned false => the resume capability rides plain HTTP in prod.
    #   PORTAL_ORIGIN  -- pinned localhost => credentialed CORS rejects the real portal, so the
    #                     applicant cannot continue submit -> decision/offer/accept.
    # Both must be ${VAR:-default} in docker-compose.yml so a real deploy's .env/host value wins;
    # the local http relaxation lives in docker-compose.demo.yml only. This job BLOCKS -- no
    # continue-on-error -- so a future edit that re-pins a literal in the base file fails CI.
    # It also asserts no committed compose file publishes a DATASTORE port to the host (D21):
    # an open 6379 hands over live officer sessions and raw resume-continuation tokens, which
    # is the one thing origination hashes before it will store it in Postgres.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base compose does not pin resume-cookie CORS/Secure config
        run: |
          set -euo pipefail
          # Every COOKIE_SECURE / PORTAL_ORIGIN assignment in the BASE file must interpolate a
          # variable (contain "${"). A literal value fails. The demo override is exempt.
          if grep -nE '^[[:space:]]*(COOKIE_SECURE|PORTAL_ORIGIN):' docker-compose.yml \
              | grep -vF '${'; then
            echo "FAIL: base docker-compose.yml pins COOKIE_SECURE/PORTAL_ORIGIN to a literal."
            echo "Use \${VAR:-default} so a real deploy's value wins; keep localhost/false in docker-compose.demo.yml."
            exit 1
          fi
          echo "OK: resume-cookie CORS/Secure config is deployment-overridable in base compose."
      - name: no committed compose file enables LLM_TRACE_CONTENT
        # LLM_TRACE_CONTENT=true puts the prompt (system, messages), the raw provider
        # response (text) and the validated body (result) on the LangSmith spans. The
        # freeze trace requirement forbids retaining prompts and responses outright, and
        # ADR 0005's boundary is what keeps applicant data off a third-party sink -- so
        # the flag is a deliberate, non-production debugging act by whoever exports it in
        # their own shell, never a property of a file anyone can inherit. Today the base
        # file interpolates it (${LLM_TRACE_CONTENT:-false}), .env.example keeps the line
        # commented, and the demo override sets only the two non-secret provider-selection
        # keys (CLAUDE_PROVIDER, AWS_REGION) and no trace or content key. This asserts that,
        # in EVERY committed compose file including the demo override -- the base-file-only
        # scope of the step above is wrong for this key, because the demo override is
        # exactly where a "make the trace readable on stage" edit would land. Only a
        # literal false or an interpolation whose OWN default is false is safe -- an
        # interpolation defaulting to true or to nothing must fail too, see
        # scripts/check_compose_trace_flag.sh.
        run: ./scripts/check_compose_trace_flag.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: no committed compose file publishes a datastore port to the host
        # D21. The Postgres half is a credentialed bypass of the gateway trust boundary --
        # one shared schema, so a direct connection is the whole platform. The REDIS half
        # needs no credential at all: the base file runs redis with no `requirepass` and
        # REDIS_URL carries no auth, while the gateway stores two BEARER credentials there
        # (services/gateway/app/auth.py) -- `session:{token}` holds a live admin/underwriter
        # session and `resume:{sid}` holds the RAW continuation token that authorizes the
        # money-moving routes. Postgres stores that same token only as a keyed digest
        # (origination-service/app/authz.py::hash_token), so an open 6379 undoes a control
        # that was built on purpose. The test grades the RESOLVED config (PyYAML applies the
        # same anchor/alias/merge-key resolution Compose does) rather than the source text,
        # because an anchored `x-pg: &pg {ports: [..]}` merged in with `<<: *pg` publishes
        # 5432 with no `ports:` line anywhere in the service block. It keys on the PRESENCE
        # of the resolved `ports` key rather than on its value, so a flow sequence or long
        # syntax cannot slip past a value regex; it refuses a datastore using `extends:`,
        # which is the one construct the loader cannot follow; it refuses `network_mode` on
        # a datastore, because `host` puts the process in the HOST network namespace --
        # listening on 5432/6379 there with no `ports:` key needed or accepted, which a
        # ports-only rule passes green -- while `service:`/`container:` hide which namespace
        # publishes it; it refuses a datastore joining a network this file cannot prove is
        # a private bridge (`driver: macvlan` is a LAN address of its own, `external: true`
        # is created elsewhere), while accepting the default driver so a private `backend`
        # network stays possible; it grades EVERY file name Compose reads, including
        # `compose.yaml`, which takes precedence over `docker-compose.yml`; and it fails
        # closed if either service is ever renamed -- every case is scoped by service NAME,
        # so a rename would otherwise leave it vacuously green.
        # Its own install line, per the kyc-persistence-gate lesson: this step
        # must not pass on a package an unrelated earlier step installed.
        run: |
          pip install pytest pyyaml
          python -m pytest scripts/tests/test_compose_datastore_ports.py -q
      - name: demo override's boot claims match what boot actually checks
        # test_llm_startup.py's two compose assertions are the reason this step exists:
        # one pins the runtime behaviour (provider=bedrock with NO AWS credential boots
        # clean -- load_llm_config validates CLAUDE_API_KEY only on the anthropic path and
        # BedrockAdapter builds its SDK client lazily), the other pins the demo override's
        # comment so it cannot tell an operator that `compose up` proves the credential.
        # The file also runs in the `backend` matrix job, which is continue-on-error +
        # `|| true` -- so without this step a comment that promises a boot-time credential
        # check could regress on a green build, and the operator finds out in the room.
        # Its own install line, per the kyc-persistence-gate lesson: this step must not
        # pass on a package an unrelated earlier step installed.
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_llm_startup.py -q

  kyc-enforcement-gate:
    # ADR 0011 is a compliance control: a regulated decision, an offer, and loan boarding
    # must not proceed on an application whose identity check failed or never ran. The
    # tests in test_kyc_gate.py prove decision/offer/accept 409 on a declined or absent
    # KYC. They also run in the `backend` job under continue-on-error/|| true, so a
    # reopened gap would stay green. This job MUST block -- no continue-on-error, no
    # `|| true`.
    #
    # The other half of the control -- that kyc-service actually persists a kyc_checks row --
    # is kyc-persistence-gate below, deliberately its own job rather than a second step here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service KYC enforcement tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_kyc_gate.py -q

  kyc-persistence-gate:
    # The kyc-enforcement-gate above only holds if kyc-service actually persists a kyc_checks
    # row for every successful KYC response: test_kyc_persistence.py proves /kyc/check fails
    # closed (503) when the insert fails instead of reporting a pass with no row, and that a
    # partial / entity request (no dob/ssn) persists a pass/fail row rather than 422-ing into
    # a phantom "KYC unavailable". Runs under the continue-on-error backend job too, so it
    # blocks here. No continue-on-error, no `|| true`.
    #
    # Its OWN job, not a second step on kyc-enforcement-gate, because steps in one job share a
    # Python environment: as a trailing step it ran after origination-service's requirements
    # were installed, and test_kyc_persistence.py's five `TestClient` uses need httpx, which
    # kyc-service did not pin. The step passed on a dependency no manifest in its own service
    # declared -- a gate green for a reason unrelated to what it asserts. A separate runner
    # installs services/kyc-service/requirements.txt and nothing else, so the pin is
    # load-bearing and CI itself is the regression test for it: drop the pin and this job
    # errors at collection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kyc-service persistence + boundary-contract tests
        run: |
          cd services/kyc-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_kyc_persistence.py -q

  ssn-purge-gate:
    # D33. app/purge_ssn.py nulls applicants.ssn -- irreversible, and its eligibility
    # query is a KNOWN-WRONG placeholder (calendar age since submission, not the
    # application-terminal-state trigger the real rule needs), so running it today would
    # destroy the digits a still-decisionable application's bureau re-pull depends on.
    # Three gates stand in front of it. Two are operator-flippable (SSN_PURGE_ENABLED,
    # --execute); the third, _ELIGIBILITY_IS_PLACEHOLDER, is a module constant precisely
    # so it cannot be flipped without a diff. test_purge_ssn.py is what makes that
    # constant load-bearing rather than decorative: it proves --execute with the env gate
    # OPEN still refuses, never opens a transaction, and exits 2 rather than a clean 0.
    #
    # Those tests run in the `backend` matrix too, which is continue-on-error + `|| true`
    # -- so deleting the interlock, or letting the refusal degrade into a 0-row "success",
    # would ship on a green build. That is debt D29's shape, and here it guards an
    # irreversible operation on SSNs, so it gets its own BLOCKING job: no
    # continue-on-error, no `|| true`.
    #
    # test_intake.py rides along because it pins the other half of the slice -- that
    # intake writes ssn_last4 on every submit and that the KYC hop carries last-4 instead
    # of the full SSN. A regression there silently puts full SSNs back on the wire while
    # every assertion about the purge still passes.
    #
    # test_seed_ssn_last4_backfill.py rides along too (B1, fix/ssn-at-rest review): a
    # fresh volume never runs migration 0023, only db/init/*.sql, so the seed's own
    # ssn_last4 backfill is what keeps a freshly-seeded applicant out of the same
    # ssn_last4-NULL state the purge/intake tests above assume never happens.
    #
    # Its own install line, per the kyc-persistence-gate lesson above: this job must not
    # pass on a package an unrelated earlier step installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination SSN purge interlock + intake last-4 tests
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_purge_ssn.py tests/test_intake.py tests/test_seed_ssn_last4_backfill.py -q

  payment-idempotency-gate:
    # D19: a retried POST /payments used to insert a second payments row and charge the
    # card again (measured 2026-08-02: one $100 intent sent eight ways captured $800.00).
    # The control is a PARTIAL unique index plus an insert-first claim against it, and it
    # is exactly the class of money-math test the `backend` matrix runs under
    # continue-on-error + `|| true` -- which is how the 4.5pp APR defect survived. So it
    # blocks here. No continue-on-error, no `|| true`.
    #
    # Three suites, one runner:
    #   test_idempotency_vectors.py  the D1 behaviour table (R1/R2/R3/R3b/R6/R6c/R7) plus
    #                                the 2026-08-02 reproduction inverted. R3c is
    #                                xfail(strict) and MUST stay red -- it goes green only
    #                                when D4b adds bank_token, and strict makes an
    #                                unexpected pass a failure rather than a silent win.
    #   test_payments_idempotency_ddl.py  the init DDL and migration 0018 declare the same
    #                                columns and indexes, so a fresh volume and an upgraded
    #                                one cannot end up with different schemas.
    #   test_idempotency_parity.py   the claim block has not drifted between the two charge
    #                                handlers (debt D23), same duty redactor-drift carries.
    #
    # test_idempotency_ddl_live.py (R-DDL/R-DDL2) is NOT run here: it needs a real Postgres
    # and SKIPS without one, and a gate whose vectors skip is a gate reporting success for
    # a path it verified nothing on. Run it against a live database before merge; the
    # services job below has no Postgres attached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: payment-service idempotency vectors + DDL parity
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_idempotency_vectors.py \
                           tests/test_payments_idempotency_ddl.py -q
      - name: servicing-service second-handler parity
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_idempotency_parity.py -q

  assistant-telemetry-gate:
    # Production evals for the officer assistant (migration 0021). One assistant_runs row
    # per officer request is what gives any rate about the assistant a denominator: the
    # spans are content-free by design and `trace()` is a no-op unless LANGSMITH_TRACING
    # is set, so LangSmith's population is whatever happened to be exported.
    #
    # A regression here is SILENT, which is why it needs a blocking job rather than the
    # `backend` matrix. `assistant_runs.record` swallows every failure on purpose -- a
    # telemetry fault must never 500 an officer's answer -- so a broken write path, a
    # dropped column, or an unapplied migration produces working requests, a healthy
    # response, and no rows at all. Nothing fails. The reports simply get quieter, and a
    # quiet report reads like a good week.
    #
    # These suites also run in the `backend` matrix job, which is continue-on-error with
    # `python -m pytest -q || true`, so they cannot hold anything there. Same precedent as
    # tila-vectors-gate, reconciliation-gate, atomic-apply-gate and no-sad-gate. This job
    # MUST block -- no continue-on-error, no `|| true`.
    #
    # Why these files:
    # test_assistant_runs.py       the row is written at the ENTRY span, where refusals
    #                              are translated -- inside assistant.run() it would
    #                              record successes only. Also the never_decisioned split:
    #                              a subclass caught in the wrong order silently refiles
    #                              every never-decisioned run as not_found.
    # test_assistant_runs_ddl.py   the init DDL and the migration declare one table; drift
    #                              between them means a fresh volume and a migrated volume
    #                              disagree about what may be stored.
    # test_db_readiness.py         the rung is wired into database_reachable(). Only this
    #                              suite proves an unmigrated volume reports unhealthy end
    #                              to end -- and it is the ONLY thing that reports the
    #                              swallowed write at all.
    # test_migration_0021_live.py  against a real Postgres. Text vectors cannot answer
    #                              whether the file runs twice, whether the guard fires on
    #                              a table CREATE TABLE IF NOT EXISTS would have accepted,
    #                              or whether the CHECKs reject the rows they claim to. A
    #                              constraint nobody has watched refuse a row is a comment.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service assistant_runs write path, DDL parity, readiness rung
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_assistant_runs.py \
                           tests/test_assistant_runs_ddl.py \
                           tests/test_db_readiness.py -q
      - name: migration 0021 against a real Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_only_not_a_real_secret@localhost:5432/meridian
          # No skip path in CI. A skipped pytest exits 0, so without this a typo'd DSN, a
          # postgres service that never came up, or a missing psycopg2 would leave this
          # BLOCKING gate green having verified nothing about the migration.
          REQUIRE_LIVE_DB: "1"
        run: |
          cd services/origination-service
          python -m pytest tests/test_migration_0021_live.py -q

  no-sad-gate:
    # D13a / ADR 0013 Decision 2. payments.cvv stored sensitive authentication data.
    # PCI-DSS 3.2.1 prohibits retaining SAD after authorization outright -- no retention
    # window, no compensating control -- so the remediation is a deletion of the values
    # and the column, and a regression here reintroduces prohibited data rather than
    # breaking an assertion.
    #
    # These vectors ran ONLY in the `backend` matrix job, which is continue-on-error with
    # `python -m pytest -q || true`. A control whose test inherits `|| true` is not a
    # control. Same precedent as tila-vectors-gate, reconciliation-gate and
    # atomic-apply-gate. This job MUST block -- no continue-on-error, no `|| true`.
    #
    # Both services, because the deletion has to hold in four places at once and two of
    # them are duplicated per service (debt D23): the init DDL and the seed (a fresh
    # volume must not create or populate the column), migration 0020 (an existing volume
    # must NULL, DROP and then REWRITE the heap -- DROP COLUMN alone leaves every value
    # readable in the data files), both charge handlers and both request models, and the
    # readiness rung that refuses a volume still carrying the column.
    #
    # test_db_readiness.py is run too, not just test_no_sad.py: the rung is wired into
    # database_reachable(), and test_no_sad.py calls it directly. Only the readiness suite
    # proves an unmigrated volume actually reports unhealthy end to end.
    #
    # This job and assistant-telemetry-gate are the only two in this file with a database
    # behind them (migration 0020 here, 0021 there). Both need one: the
    # migration is applied BY HAND, so "does this file run a second time" is a question
    # only Postgres can answer, and every other vector here grades SQL as text. A skipped
    # live vector inside a blocking gate would report success for a path it never ran --
    # the failure these gates exist to prevent -- so the service container is what makes
    # the re-runnability claim real rather than conditional.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only_not_a_real_secret
          POSTGRES_DB: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: payment-service SAD deletion vectors + readiness
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_no_sad.py tests/test_db_readiness.py -q
      - name: servicing-service SAD deletion vectors + readiness
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_no_sad.py tests/test_db_readiness.py -q
      # The redactor is the backstop for a stale caller that still puts a cvv key in a
      # body: the column is gone, the field can still be logged. Both suites already run
      # under the blocking redaction-tests job; this step names the dependency so nobody
      # deletes the cvv masking as dead code now that no column feeds it.
      - name: the log redactor still masks a cvv field
        run: |
          cd services/payment-service
          python -m pytest tests/test_logging_redaction.py -q -k cvv
      # Migration 0020 against a real Postgres: it must purge a pre-0020 volume AND run
      # clean a second time. The operator applies these by hand with no runner, so a
      # re-run after a partial attempt is the normal path -- an unguarded first statement
      # aborts the file before the DROP and the VACUUM FULL that actually destroys the old
      # row versions, and the recovery attempt then reports failure over a volume still
      # holding every value. Its own install line, not the earlier step's: a step that
      # runs on a package no manifest in its own service declares passes until the job is
      # reordered (the kyc-persistence-gate precedent).
      - name: migration 0020 re-runs clean against a real Postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci_only_not_a_real_secret@localhost:5432/meridian
          # No skip path in CI. A skipped pytest exits 0, so without this a typo'd DSN, a
          # postgres service that never came up, or a missing psycopg2 would leave this
          # BLOCKING gate green having verified nothing about the migration.
          REQUIRE_LIVE_DB: "1"
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_migration_0020_live.py -q

  tila-vectors-gate:
    # The disclosed APR is a regulated number with a Reg Z TOLERANCE: exceeding it is a
    # violation, not a rounding nit. compute_apr shipped an add-on annualization instead of
    # the actuarial method and was 4.5pp wrong (~36x the 0.125pp tolerance) on every loan --
    # 5.041% disclosed on a 7.99% note. Nothing caught it, for two reasons this job closes:
    # the unit test compared the implementation against a re-derivation of its own formula,
    # and it ran in the `backend` job under continue-on-error/|| true. A money-math gate that
    # inherits `|| true` is not a gate. This job MUST block -- no continue-on-error, no
    # `|| true`.
    #
    # test_tila_vectors.py holds expectations pinned as literals from an independent
    # 50-digit Newton solve (apr.py uses bisection), plus a bracket check that validates the
    # literals themselves without calling apr.py. test_apr.py carries the invariants that
    # make the old error unshippable (APR never below the note rate; APR collapses to the
    # note rate at zero fee). test_rules.py is here because the fee feeds the APR: a
    # silently defaulted or drifted origination fee moves the disclosed rate, so the
    # fail-closed loader is part of the same control, not a separate concern.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: disclosure-service TILA vectors + APR invariants + fee-config fail-closed
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_tila_vectors.py tests/test_apr.py tests/test_rules.py -q

  disclosure-narration-gate:
    # D37 (docs/debt-log.md), Minimum Build Slice #4 (docs/specs/disclosure-narration-judge.md).
    # D1's deterministic guard (`_narration_is_grounded`, disclosure_coordinator.py) already
    # blocks a fabricated figure from reaching the officer, but origination-service's pytest
    # runs under the tolerated `backend` matrix `|| true` -- same shape that let the D2
    # add-on-vs-actuarial APR defect through before tila-vectors-gate existed. This job takes
    # the guard, its pinned fixture set (D2), and the offline judge that grades the raw
    # completion against them (D3) out of that tolerance. All three test files run entirely
    # on FakeAdapter -- no network call, no live model key, same offline shape as the D2/D3
    # split the spec requires.
    #
    # test_disclosure_coordinator.py is a 700+ line file covering the whole coordinator, most
    # of it outside this debt entry's scope, so this job selects only the D1 groundedness
    # tests by name rather than promoting the whole file to blocking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service narration groundedness guard (D1) + fixtures (D2) + offline judge (D3)
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          D1_FILTER="rejected_narration or healthy_narration or fabricated_dollar_figure or \
            dollar_figure_equal_to_the_term_count or percent_figure_equal_to_the_term_count or \
            spelled_out_note_rate"
          # -k selects by name out of a 700+ line file that is mostly out of scope for this
          # gate (see job comment); a future rename of any of these six tests would make -k
          # match nothing and pytest would exit 0 having verified none of them, so the count
          # is asserted explicitly rather than trusted to the exit code alone.
          COLLECTED=$(python -m pytest tests/test_disclosure_coordinator.py -k "$D1_FILTER" --collect-only -q | grep -c "::test_")
          if [ "$COLLECTED" -ne 6 ]; then
            echo "expected 6 D1 groundedness tests selected by name, got $COLLECTED -- a test was likely renamed; update the -k filter in this job" >&2
            exit 1
          fi
          python -m pytest tests/test_disclosure_coordinator.py -k "$D1_FILTER" -q
          python -m pytest tests/test_disclosure_narration_fixtures.py tests/test_narration_judge.py -q

  reconciliation-gate:
    # Settlement reconciliation is the only thing that compares what the processor captured
    # against what a loan was credited (ADR 0015). D19 now prevents the exact-retry case at
    # capture: payments.idempotency_key sits under a partial unique index (#63) and both
    # charge handlers claim it insert-first via claim_or_branch() before the processor is
    # contacted (#65), held by the payment-idempotency-gate below. Reconciliation is still
    # how everything else is found: a processor-side duplicate, a break that predates D19,
    # or a payment that never reached a ledger. A regression in reconciliation is silent by
    # construction: the report still runs, still exits 0, and still looks clean.
    #
    # Its 1,499-line test_reconciliation.py and the four files beside it ran ONLY in the
    # `backend` matrix job, which is `continue-on-error: true` with `python -m pytest -q
    # || true` (this file, the Tests step above) -- so a broken break-classifier shipped on a
    # green build. Fourteen other control areas each hold a dedicated blocking job; this was
    # the largest suite in the repo without one.
    #
    # Exactly the failure mode tila-vectors-gate exists to close, and the reason to state it
    # twice: compute_apr was 4.5pp wrong on every loan for weeks because the money test that
    # would have caught it inherited `|| true`. A money-math gate that inherits `|| true` is
    # not a gate. This job MUST block -- no continue-on-error, no `|| true`.
    #
    # Why all five files and not just the big one:
    #   test_reconciliation.py       the matcher, break classes, per-loan absolute vs net
    #                                variance, and the duplicate pair found across a window
    #                                edge -- the arithmetic a client reads off a slide.
    #   test_reconciliation_alert.py the alert fires on the configured threshold, and ABORTS
    #                                when the threshold is unset rather than reporting a
    #                                clean close. Fail-closed is the control, not the alert.
    #   test_reconcile_cli.py        exit 0 / 1 / 2 stay distinct (clean, breaks found, could
    #                                not run) and stdout carries no report on an abort. A
    #                                dashboard must never receive a well-formed zero from a
    #                                run that could not read its own inputs.
    #   test_reconciliation_utc.py   the cut-off is pinned to UTC (#47). A local-time cut-off
    #                                silently reclassifies every row near a window boundary.
    #   test_runbook_reconciliation.py  the documented invocation and exit codes still match
    #                                the code, so docs/runbooks/operations.md cannot drift from the job
    #                                an operator actually runs on their cron.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: servicing-service settlement reconciliation, alert fail-closed, and exit codes
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_reconciliation.py \
                           tests/test_reconciliation_alert.py \
                           tests/test_reconcile_cli.py \
                           tests/test_reconciliation_utc.py \
                           tests/test_runbook_reconciliation.py -q

  agentic-loop-gate:
    # The officer assistant's tool-calling loop (search_policy retrieval, decision-record
    # lookup, native tool_use via create_agent) is the whole agentic surface named in the
    # week10 freeze (docs/plans/freeze-agentic-week10.md). It ran only in the `backend`
    # matrix job, which is continue-on-error + `python -m pytest -q || true`, so a regression
    # in any interlock below ships on a green build -- the same failure mode tila-vectors-gate
    # and reconciliation-gate exist to close for their own surfaces. This job MUST block --
    # no continue-on-error, no `|| true`.
    #
    # Five interlocks the loop swap (#76) preserved, each with a test in this list. Four
    # live in the tool closures and are covered by test_assistant.py; the fifth is PT-001,
    # added by #71 and covered by test_policy_topic.py:
    #   single-score cache          two score_application calls in one turn would fire two
    #                                regulated decision_events
    #   explain-path substitution   a score on an explain-only turn is a billable credit pull
    #                                nobody asked for
    #   query strip                 the model-authored search_policy query must never ride
    #                                into persisted history -- this failed silently once
    #                                (a pydantic ModelPrivateAttr masked the comparison) and
    #                                was caught only because a test asserted the outbound
    #                                CompletionRequest, not the seam's intent
    #   step exhaustion as refusal  create_agent's recursion limit must map to a refusal
    #                                (404/422/502/503), not an unmapped 500
    #   single search per run       PT-001: search_policy is honoured at most once, so a
    #                                model cannot compound retrieval calls or citations;
    #                                the second call is served the first answer. Its other
    #                                half is the same rule read backwards -- a policy_topic
    #                                run that reaches `final` having never searched is
    #                                refused in code, because that answer is
    #                                indistinguishable from one that searched and abstained
    #
    # test_assistant.py            the loop, and the first four interlocks above
    # test_assistant_trace.py      the root trace span shape and the no-identifiers content
    #                               rule (enum codes, integers, booleans, retrieval scores and
    #                               chunk ids only -- never application_id or request_id)
    # test_policy_retrieval.py     search_policy retrieval and the fail-closed score threshold
    # test_policy_corpus_manifest.py  manifest admission of a supplied corpus: the set the
    #                               manifest audit walks is the set the loader indexes, and a
    #                               chunk-id collision between two approved documents indexes
    #                               nothing rather than serving one document's text under the
    #                               other's citation
    # test_policy_topic.py         the closed 8-code policy_topic vocabulary; a free-text
    #                               question is masked before the model sees it. Also
    #                               interlock 5 (PT-001), both halves: a second search is
    #                               served from cache, and an unsearched policy final is
    #                               refused
    # test_prompt_contracts.py     tool_choice is asserted PRESENT now that create_agent binds
    #                               tools -- this file used to assert its absence
    # test_chat_model.py           MeridianChatModel / bind_tools, now wired into the loop
    # test_agentic_loop.py         create_agent integration: the swapped run() path
    # test_native_script.py        native tool_use blocks end to end; text-only tool calls
    #                               are refused
    # test_tool_schemas.py         CompletionRequest.tools / Completion.tool_calls / the
    #                               _redacted_turn content-block rule
    # test_injection_resistance.py  every inbound channel to the model is a projection to
    #                               enum codes, integers and code lists -- the officer's
    #                               request, both tool results, a poisoned corpus chunk,
    #                               the model-authored query and the model's own final.
    #                               The freeze asks for deterministic injection-resistance
    #                               tests; this is that file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: origination-service agentic loop, interlocks, trace content rule, tool schemas
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_assistant.py \
                           tests/test_assistant_trace.py \
                           tests/test_policy_retrieval.py \
                           tests/test_policy_corpus_manifest.py \
                           tests/test_policy_topic.py \
                           tests/test_prompt_contracts.py \
                           tests/test_chat_model.py \
                           tests/test_agentic_loop.py \
                           tests/test_native_script.py \
                           tests/test_tool_schemas.py \
                           tests/test_injection_resistance.py -q

  atomic-apply-gate:
    # D3 / ADR 0020. Crediting a captured payment to a loan exactly once is the money
    # movement this platform exists to get right, and it was wrong: the 2026-08-02 live
    # repro captured $800.00 and credited $600.00, all eight responses 200. The fix is
    # one statement whose UPDATE computes from the stored value, plus payment_applications
    # with UNIQUE (payment_id).
    #
    # These suites ran ONLY in the `backend` matrix job, which is continue-on-error with
    # `python -m pytest -q || true` -- CLAUDE.md names this path explicitly as able to
    # regress on a green build. A money-math gate that inherits `|| true` is not a gate.
    # Same precedent as tila-vectors-gate and reconciliation-gate. This job MUST block --
    # no continue-on-error, no `|| true`.
    #
    # Why these files:
    #   test_lost_update.py          the before-number. Its fixture models BOTH statement
    #                                shapes, so reverting to the read-modify-write turns it
    #                                red rather than making it error on an unexpected call.
    #   test_atomic_apply.py         the amount and the loan come off the payments row, a
    #                                replay moves nothing, and every ineligible status
    #                                (processing, ACH submitted, NULL amount_minor, another
    #                                loan's payment) writes nothing at all.
    #   test_payment_applications_ddl.py  the init DDL and migration 0019 declare one table,
    #                                byte-for-byte, and the migration RAISE EXCEPTIONs on a
    #                                shape it did not create.
    #   test_characterization_balance.py  pins that adjust_balance is now one atomic
    #                                compare-and-set (D32's second half) and refuses --
    #                                writes nothing -- when the caller's expected_balance
    #                                no longer matches the stored one.
    #   test_waive_fee_lost_update.py  D32's first half: waive_fee is now the same
    #                                atomic-UPDATE shape as apply_payment, and this is the
    #                                before-number for it, same role as test_lost_update.py.
    #   payment-service tests/test_apply_via_servicing.py  the caller sends payment_id only.
    #                                An amount back in that body is a money-creation path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: servicing-service atomic apply, replay, and the DDL both volumes get
        run: |
          cd services/servicing-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_lost_update.py \
                           tests/test_atomic_apply.py \
                           tests/test_payment_applications_ddl.py \
                           tests/test_waive_fee_lost_update.py -q
      # Selected, not the whole file: test_characterization_balance.py also pins the
      # ADR 0014 authorization gaps, which are still open and still red on purpose. Only
      # the D3/D32 assertions belong in a blocking gate -- the apply's shape, its record,
      # and both D32 halves' now-atomic shapes (waive_fee's decrement, adjust_balance's
      # compare-and-set).
      - name: servicing-service characterization of what D3/D32 changed and what they did not
        run: |
          cd services/servicing-service
          python -m pytest tests/test_characterization_balance.py -q \
            -k "(apply_payment or adjust_balance_is_now or adjust_balance_refuses_when_balance_moved or waive_fee_is_now) and not route_takes_no_caller_identity"
      - name: payment-service sends payment_id only, and cannot retire an unapplied capture
        run: |
          cd services/payment-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_apply_via_servicing.py \
                           tests/test_idempotency_vectors.py -q

  db-readiness-gate:
    # DB readiness is a security control: a passwordless / placeholder / stale
    # DATABASE_URL must report unhealthy, not connect unauthenticated or fail
    # auth at first query. The per-service test_db_readiness.py tests run in the
    # `backend` job too, but that is continue-on-error/|| true, so a reopened
    # gate would stay green. This job MUST block — no continue-on-error, no
    # `|| true`. Covers every service that implements the gate.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, origination-service, servicing-service, kyc-service, disclosure-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ${{ matrix.service }} DB readiness regression tests
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt pytest
          python -m pytest tests/test_db_readiness.py -q

  decision-db-readiness-gate:
    # decision-service implements the same DB readiness gate; its tests live in
    # test_decision.py (alongside the bureau-key/synthetic gates). Blocking, like
    # db-readiness-gate above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decision-service DB readiness regression tests
        run: |
          cd services/decision-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_decision.py -k "database_url or internal_service_token or schema" -q

  migration-numbering-gate:
    # Migrations are hand-applied with no runner (compose mounts db/init/* only), so this job
    # holds the two properties an operator cannot check for themselves at rollout time: the
    # apply ORDER is unambiguous, and each file can actually execute.
    #
    # Order: a duplicate NNNN prefix -- two feature branches each grabbing the next number --
    # means following the numeric sequence can run a later migration before the one it depends
    # on (e.g. a document_body ALTER before its CREATE TABLE). This branch hit exactly that
    # with two 0011_* files.
    #
    # Executability: the DDL tests are text assertions, so 0018 merged unable to parse -- a
    # `DO $$` body closed early by a nested `$$` literal, aborting the migration at a syntax
    # error and skipping every verification block after it. The second step below reproduces
    # Postgres's dollar-quote lexing rule over every SQL file in the repo, so it grades every
    # migration without a database. Exactly one job DOES run migration SQL against a real
    # server -- no-sad-gate, which has a postgres service and applies 0020 -- and it covers
    # that one file only; this job stays the check that holds for all of them.
    #
    # Blocking -- no continue-on-error, no `|| true`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No duplicate migration version numbers
        run: |
          set -euo pipefail
          dupes=$(ls db/migrations/ | grep -oE '^[0-9]{4}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Duplicate migration version number(s) in db/migrations/:"
            echo "$dupes"
            echo "Two files share an NNNN prefix; renumber one so the apply order is unambiguous."
            exit 1
          fi
          echo "OK: all db/migrations/ version numbers are unique."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest
      - name: Migration SQL parses (no DO block closed by a nested dollar-quote)
        # Same file as the D19 declaration-parity tests: it is the only place that grades
        # 0018, and it needs nothing but pathlib + re, so it runs from the repo root with
        # no service requirements installed. Those parity tests run here too -- they are
        # otherwise only in the `backend` matrix, under continue-on-error + `|| true`.
        run: python -m pytest services/payment-service/tests/test_payments_idempotency_ddl.py -q

  disclosure-lifecycle-gate:
    # The disclosure controls this week rests on -- delivery gating (a delivered flag over a
    # persisted, readable document), provenance completeness (the chain the KG view reports),
    # document persistence + figure/spelling agreement, and downstream-refusal-vs-outage
    # handling -- live in these suites, NOT in the money-math (tila-vectors-gate) or DB
    # readiness (db-readiness-gate) gates. They otherwise run only in the `backend` matrix
    # under continue-on-error/|| true, so a regression in delivery gating, provenance, or
    # document persistence merges with green CI. These are correctness/compliance controls,
    # not flaky money-math: this job MUST block -- no continue-on-error, no `|| true`.
    #
    # disclosure-service: the persistence/lifecycle boundary (create, replay/backfill,
    # transition gating, offer-disagreement + document-disagreement refusals) and the
    # provenance DDL guards. origination-service: the pipeline coordinator (route/compute/
    # verify/narrate/persist, the one retry cycle, tracing suppression) and the officer-facing
    # disclosure route (officer-only generation, downstream-refusal 4xx passthrough).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: disclosure-service lifecycle + provenance suites
        run: |
          cd services/disclosure-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_disclosures.py tests/test_schema_provenance.py -q
      - name: origination-service disclosure coordinator + route suites
        run: |
          cd services/origination-service
          pip install -r requirements.txt pytest
          python -m pytest tests/test_disclosure_coordinator.py tests/test_disclosure_route.py -q

  rag-eval-gate:
    # The RAG eval hygiene gate (refuses contaminated kb_dump: ssn/pan/ein) and
    # the cache pruning are security controls: they prove raw PII never reaches
    # the report or the embedding cache (ADR 0007). Like the other security
    # gates, this MUST block — a regression in the gate or cache pruning must not
    # ship on a green build. No continue-on-error, no `|| true`. The harness is
    # offline by design (no service/docker dependency); tests need only pytest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rag_eval unit + integration tests
        run: |
          pip install pytest
          python -m pytest rag_eval/tests -q
      - name: rag_eval real-corpus smoke (refusal + no raw PII in report/cache)
        run: ./scripts/smoke_rag_eval.sh

  rag-eval-import-gate:
    # Card G2a: origination builds from the REPO ROOT so the image carries the repo-root
    # rag_eval/ package — `import rag_eval` did not resolve in the container before that,
    # and G2b's search_policy tool, on `main` since PR #64, is built on top of this holding
    # and is smoked by the same script. The file assertions in
    # test_rag_eval_seam.py also run in the `backend` job under continue-on-error/|| true,
    # so a reverted build context would stay green there. This job MUST block — no
    # continue-on-error, no `|| true` — and it proves the import in the built image, not in
    # the Dockerfile text: a gate that checks only the spelling verifies nothing about the
    # artifact that ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rag_eval imports inside the origination image
        run: ./scripts/check_rag_eval_import.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + build
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      # Blocking, like the other control gates: these are regression tests for
      # per-route state leaking one applicant's or borrower's regulated facts onto
      # another's screen. A build-only job would let that class back in silently.
      - name: Test
        run: |
          cd frontend
          npm test

  secret-scan:
    # Secret literals must never re-enter the tracked tree. Runs the same scan
    # documented in docs/security-remediation-2026-07.md and BLOCKS the build on
    # any hit — previously this was docs-only, so a config denylist re-committed
    # the leaked Postgres password literal across all seven services and nothing
    # caught it. Blocking, like the other security-control gates: no
    # continue-on-error, no `|| true`.
    #
    # The scanner definitions here and in the remediation doc necessarily quote
    # the patterns, so both files are excluded from their own scan; every other
    # tracked path (incl. docs/, services/) is scanned. Intentional test fixtures
    # under */tests/ are excluded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No leaked secret literals in tracked tree
        run: |
          set -euo pipefail
          # AWS credential shapes are added so an accidental Bedrock/AWS credential
          # commit fails CI too, not just the four known-leaked literals:
          #   (AKIA|ASIA)+16     — IAM access-key IDs
          #   ABSKQmVkcm9ja      — Bedrock long-term API key (fixed base64 prefix)
          #   bedrock-api-key-   — Bedrock short-term API key
          # Both Bedrock forms are bearer tokens consumed by boto3 via
          # AWS_BEARER_TOKEN_BEDROCK; rag_eval never reads them as a literal. IAM
          # secret-access keys (40-char base64) are too generic to match without
          # false positives — the control is: creds live in ~/.aws or the shell
          # env, never a tracked file (see docs/plans/phase1-bedrock-pgvector.md).
          if git grep -nIE 'cb_live_|proc_live_|EXAMPLE-LEAKED-KEY|meridian_dev_pw_2024|(AKIA|ASIA)[0-9A-Z]{16}|ABSKQmVkcm9ja|bedrock-api-key-' \
              -- ':!docs/security-remediation-2026-07.md' \
                 ':!.github/workflows/ci.yml' \
                 ':!*/tests/*'; then
            echo "FAIL: leaked secret literal found in tracked tree (see matches above)."
            exit 1
          fi
          echo "OK: no leaked secret literals."
      # NOTE: a blocking git-HISTORY scan (git log --all -G over all refs) is
      # deliberately NOT here. Those literals are still reachable in history, so
      # the scan is red until the credentials are rotated and history is
      # rewritten (see docs/security-remediation-2026-07.md). Enabling it now
      # would make this branch permanently unmergeable, conflating enforcement
      # with the not-yet-done remediation. It lands as a separate follow-up PR
      # AFTER the rewrite, when it can pass. Tracked in that follow-up.
      - name: .env must not be tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "FAIL: .env is tracked; it must be gitignored (.env.example is fine)."
            exit 1
          fi
          echo "OK: no tracked .env."

  doc-path-lint-tests:
    # BLOCKING, unlike the lint run below. These tests are hermetic — each case
    # builds a throwaway git repo in $TMPDIR — so they assert the gate's own logic
    # is intact, never the state of the docs. A neutered `resolves()` turns the
    # `absent path fails` case red, which is the only thing standing between this
    # gate and one that passes unconditionally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_doc_paths.sh tests
        run: ./scripts/test_check_doc_paths.sh

  doc-path-lint:
    # CLAUDE.md and docs/kb.md are loaded by every agent session before it edits
    # code, so a path they cite that exists only on an unmerged branch starts the
    # session from a wrong-by-construction state. This asserts every backticked
    # repo-path in those docs (and README.md) resolves in the branch's own tree.
    # A reference that is absent ON PURPOSE goes in scripts/doc_path_lint_allow.txt
    # with a reason; an entry there that starts resolving fails the run.
    #
    # BLOCKING. It passes on main today (README.md, 11 paths, all resolve), so this
    # costs nothing now — and it is deliberately armed BEFORE the change that gives
    # it teeth. CLAUDE.md and docs/kb.md are untracked on every branch, so CI checks
    # out neither and reports them SKIPPED; the PR that tracks them will turn this
    # red, because main's copies cite the post-#12 world (policies/fee_schedule.json,
    # disclosure-service/app/rules.py) that main does not contain. Red on that PR is
    # the point: reconciling the references is that PR's job, and warn-only would
    # have let it land unreconciled. Note those two are NOT allowlist material —
    # they resolve on the feature branch, where the stale-entry check would then fail
    # on the exemption itself. The fix is merging the open PRs, not an exemption.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backticked doc paths resolve in this tree
        run: ./scripts/check_doc_paths.sh

  retired-doc-path-tests:
    # BLOCKING, like doc-path-lint-tests. Hermetic apart from two deliberate cases
    # that assert against the real tree, because they are claims about THIS repo's
    # layout that a fixture cannot make: that the scan reaches a non-trivial number
    # of tracked files, and that the gate's self-exclusion is still exactly itself
    # plus this test. The gate necessarily contains the patterns it bans, so it must
    # skip those two files; a third exclusion would be a place to hide a dead path,
    # and the exclusion set is pinned here rather than left to review.
    #
    # The load-bearing cases are the six "retired pattern N caught" ones. Dropping
    # any single pattern from the gate turns at least one of them red (verified by
    # deleting each in turn), so the gate cannot quietly narrow to a no-op.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_retired_doc_paths.sh tests
        run: ./scripts/test_check_retired_doc_paths.sh

  retired-doc-path-lint:
    # BLOCKING. The specs, runbooks and scoping docs moved into docs/specs/,
    # docs/runbooks/ and docs/scoping/, and every reference in the tree was
    # repointed in the same change. This refuses the pre-move spellings coming
    # back.
    #
    # Why a gate rather than trusting the sweep: roughly 25 unmerged branches still
    # carry the old spellings in their own prose, and merging any of them
    # re-introduces a dead reference that nothing else here grades. doc-path-lint
    # reads only README.md, CLAUDE.md and docs/kb.md; docs-drift reads the same
    # three. This one reads the whole tracked tree, which is the scope that matters:
    # the reference that would have broken reconciliation-gate during the move was
    # not prose and not in a doc — it was a path built by joining quoted segments
    # inside a servicing test.
    #
    # Why not extend doc-path-lint instead: that gate asserts a cited path EXISTS,
    # which is right for orientation docs and wrong for ADRs and specs. An ADR cites
    # the path of a REJECTED option, a spec cites work it proposes and migrations
    # later renumbered — grading those 30 docs yields 99 absences, most correct to be
    # absent, and the allowlist would fill with permanent entries. This gate asks the
    # decidable question instead: not "does this path exist" but "is this path one we
    # know is dead". No allowlist, no false positives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No reference to a retired doc path
        run: ./scripts/check_retired_doc_paths.sh

  spec-diff-gate-tests:
    # BLOCKING, like doc-path-lint-tests. Hermetic — each case builds a throwaway git
    # repo in $TMPDIR — so it asserts the gate's own logic, never the state of the
    # repo's specs. The load-bearing case is `code area without required spec fails`:
    # without it the gate could pass unconditionally and nothing here would notice.
    # Two cases are deliberately NOT hermetic, both because they assert a claim about
    # THIS repo that a fixture cannot make: `audit globs still match this repo's tree`
    # (the coverage audit's `adr/*.md` / `docs/specs/*.md` globs must keep matching
    # this layout) and `ADR 0023 keeps a map line for every code path it obligates`
    # (the gate's coverage audit grades docs, not code paths, so a code path can be
    # dropped from scripts/spec_gate_map.txt -- replaced by a sibling rather than
    # joined by one -- with spec_diff_gate.sh still exiting 0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: spec_diff_gate.sh tests
        run: ./scripts/test_spec_diff_gate.sh

  spec-diff-gate:
    # A code area with a merged spec/ADR must keep one — existence, not a same-PR
    # diff: spec and implementation land in separate PRs/weeks here on purpose (see
    # docs/kb.md's weekly cadence). scripts/spec_gate_map.txt lists the pairings that
    # have already merged. BLOCKING. Passes on main today (decision-service,
    # disclosure-service, payment-service each still have their paired spec+ADR), so
    # this costs nothing now. Add a code area to the map only once its spec/ADR has
    # actually merged — servicing-service joined the map with ADR 0014 (week 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapped code areas still have their required spec/ADR
        run: ./scripts/spec_diff_gate.sh

  docs-drift-tests:
    # BLOCKING, like doc-path-lint-tests. Hermetic — each case builds a throwaway git
    # repo in $TMPDIR — so it asserts the gate's own logic, never the state of the docs.
    # The load-bearing case is `banned claim fails`: an emptied BANNED list or a typo'd
    # regex would make docs-drift below pass unconditionally, and this is the only thing
    # standing between that gate and one that is green over any lie.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_doc_claims.sh tests
        run: ./scripts/test_check_doc_claims.sh

  docs-drift:
    # BLOCKING. README.md/CLAUDE.md/docs/kb.md are the platform's authoritative prose;
    # the seed README claimed "PCI-DSS compliant (cardholder data encrypted)" while
    # payment-service stores PAN+CVV in plaintext, and told the reader "the real .env is
    # already in the repo" (false and unsafe — secret-scan blocks a tracked .env). This
    # refuses a FIXED list of known-false claims. It is not a semantic reviewer: it checks
    # banned literals only, the companion to doc-path-lint's path-existence check. Extend
    # the list when a claim is retired; delete an entry only when its claim becomes true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No banned compliance/safety claims in the authoritative docs
        run: ./scripts/check_doc_claims.sh

  volatile-claim-lint-tests:
    # The gate below is only worth its blocking status if it can actually fail. This
    # proves it: an open-PR claim, a freshness stamp, a tip sha, a spelled-out count and
    # an unanchored ref each turn it red, while an anchored merge citation stays green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Volatile-claim lint self-tests
        run: ./scripts/test_check_volatile_claims.sh

  volatile-claim-lint:
    # BLOCKING. Third gate in the doc family and a different KIND from its two siblings:
    # doc-path-lint asks whether a cited path exists, docs-drift refuses a curated list of
    # known-false literals, and this one refuses a whole CLASS of sentence -- one that is
    # true when written and false when it lands.
    #
    # Why a third was needed: docs/kb.md carried ~315 hand-copied derived facts, and 14 of
    # the 25 commits that ever touched it were pure stale-fixes. A curated list cannot
    # close that, because the author writing the decaying sentence is the same person who
    # would have to add it to the list. Banning the shape needs nobody to notice anything.
    #
    # An immutable citation still passes -- "merged as #77 (ceda4e2)" names a merge commit,
    # and a merge commit never changes. Present-tense merge state does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No decaying claims in the authoritative docs
        run: ./scripts/check_volatile_claims.sh

  kb-freshness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: State generator self-tests
        run: ./scripts/test_gen_state.sh

  kb-freshness:
    # BLOCKING. docs/state.md is the mutable half of the knowledge base -- base tip,
    # merged-PR ledger, ADR index, which jobs in this file block -- and every line of it
    # is read out of git by scripts/gen_state.sh. This refuses a hand edit and refuses a
    # copy that has not absorbed its own branch base.
    #
    # It grades against the MERGE BASE of the branch and main, not main's tip, so a
    # sibling PR merging does not turn every other open PR red. The fix when it fails is
    # always the same one command: `make kb`, then commit.
    #
    # That insulation is only real because the checkout below pins the PR HEAD sha. The
    # default pull_request checkout is refs/pull/N/merge -- the branch already merged
    # with the base tip -- which makes that tip an ANCESTOR of HEAD, so `git merge-base
    # origin/main HEAD` collapses to main's tip and the merge-base grading silently
    # becomes tip grading. It did: #92 merging turned #93 red over a page #93 never
    # touched. test_gen_state.sh pins both halves -- `merge ref grades against the tip`
    # (the git behaviour) and `kb-freshness checks out the PR head sha` (this file).
    #
    # pull_request ONLY, and that is structural rather than a convenience. On main the
    # merge base IS the tip, so the merge commit that lands a regenerated page becomes
    # the base the page would have to describe -- a state no committed file can ever be
    # in. Running it on push would leave main red between every merge and the follow-up
    # commit, and that follow-up would re-stale the page it just fixed. The branch side
    # is where the page is actually authored, and it is graded there.
    # test_gen_state.sh pins this: `committing the page on main re-stales it`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR head, NOT the default merge ref -- see the note above. The page is
          # authored on the branch, so the branch is what must be graded.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch main so a merge base exists
        # A PR checkout has no origin/main ref by default, and the generator must abort
        # rather than describe the wrong base -- so fetch it explicitly. No --depth here:
        # fetch-depth: 0 above already made this a full clone, and `--depth=0` is not a
        # valid argument ("fatal: depth 0 is not a positive number"), so passing it fails
        # the step outright.
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: docs/state.md still matches git
        run: ./scripts/gen_state.sh --check

  # GAP: no dependency audit, no SAST, no container image scan.
  # GAP: backend tests are continue-on-error, so failing money-math tests are green --
  # EXCEPT where a dedicated blocking job runs the same file outside the matrix. The money
  # paths carved out so far: the disclosure compute path (tila-vectors-gate), settlement
  # reconciliation (reconciliation-gate), and the apply-payment path (atomic-apply-gate,
  # which runs test_lost_update.py -- green since D3's fix, PR #77). Still inside the
  # suppression, and therefore still able to regress on a green build: the remaining
  # balance.py write paths, adjust_balance and waive_fee (D32).
